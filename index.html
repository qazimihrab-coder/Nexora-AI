<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Nexora AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Puter AI -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050811;
      --bg2: #080d18;
      --sidebar: #080d17;
      --card: #0d1524;
      --card2: #101b2d;
      --border: rgba(255,255,255,0.08);
      --text: #f5f7fb;
      --muted: #8c97a8;
      --blue: #1683ff;
      --blue2: #0b62d6;
      --danger: #ff4d5e;
      --green: #35d07f;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    body.light {
      --bg: #f4f7fb;
      --bg2: #ffffff;
      --sidebar: #ffffff;
      --card: #ffffff;
      --card2: #f2f5f9;
      --border: rgba(0,0,0,0.08);
      --text: #101522;
      --muted: #687386;
      --shadow: 0 20px 50px rgba(0,0,0,.08);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(22,131,255,.13), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(0,92,255,.10), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* =========================
       AUTH PAGE
    ========================= */

    #authPage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
      position: relative;
    }

    .auth-glow {
      position: absolute;
      width: 230px;
      height: 230px;
      background: rgba(22,131,255,.18);
      filter: blur(80px);
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      background: rgba(13,21,36,.88);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px 25px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    body.light .auth-card {
      background: rgba(255,255,255,.9);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1683ff, #084da8);
      box-shadow: 0 15px 40px rgba(22,131,255,.3);
      font-size: 30px;
      font-weight: 800;
      color: white;
    }

    .auth-title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-top: 7px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .auth-tabs {
      display: flex;
      background: var(--card2);
      padding: 4px;
      border-radius: 13px;
      margin-bottom: 22px;
    }

    .auth-tab {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-tab.active {
      background: var(--blue);
      color: white;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .field input {
      width: 100%;
      height: 50px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      outline: none;
      padding: 0 15px;
      font-size: 14px;
      transition: .2s;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22,131,255,.10);
    }

    .auth-button {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), #075fc8);
      color: white;
      font-size: 15px;
      font-weight: 700;
      margin-top: 5px;
      box-shadow: 0 12px 30px rgba(22,131,255,.22);
    }

    .auth-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .auth-message.error {
      display: block;
      color: #ffb5bd;
      background: rgba(255,77,94,.10);
      border: 1px solid rgba(255,77,94,.18);
    }

    .auth-message.success {
      display: block;
      color: #a8f3c8;
      background: rgba(53,208,127,.10);
      border: 1px solid rgba(53,208,127,.18);
    }

    .auth-footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.8;
    }

    /* =========================
       APP
    ========================= */

    #appPage {
      display: none;
      width: 100%;
      height: 100%;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      height: 100%;
      background: rgba(8,13,23,.94);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }

    body.light .sidebar {
      background: rgba(255,255,255,.95);
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #1683ff, #075fc8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
    }

    .brand-status {
      color: var(--green);
      font-size: 11px;
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      height: 45px;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-weight: 700;
    }

    .history-title {
      padding: 17px 17px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 5px 10px;
    }

    .history-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      margin-bottom: 4px;
      border-radius: 11px;
      color: var(--text);
      background: transparent;
      text-align: right;
    }

    .history-item:hover {
      background: var(--card2);
    }

    .history-item.active {
      background: var(--card2);
    }

    .history-name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .history-delete {
      color: var(--muted);
      background: transparent;
      font-size: 15px;
      opacity: .7;
    }

    .history-delete:hover {
      color: var(--danger);
      opacity: 1;
    }

    .sidebar-bottom {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--card2);
      border-radius: 13px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1683ff, #084da8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .user-email {
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .logout-button {
      width: 100%;
      height: 40px;
      border-radius: 11px;
      color: #ff9da8;
      background: rgba(255,77,94,.08);
      border: 1px solid rgba(255,77,94,.12);
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(5,8,17,.72);
      backdrop-filter: blur(15px);
    }

    body.light .topbar {
      background: rgba(255,255,255,.72);
    }

    .top-title {
      font-weight: 700;
      font-size: 15px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      width: 39px;
      height: 39px;
      border-radius: 11px;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 17px;
    }

    .lang-select {
      height: 39px;
      border-radius: 11px;
      padding: 0 9px;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 150px;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .welcome-inner {
      max-width: 680px;
    }

    .welcome-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1683ff, #075fc8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 31px;
      font-weight: 800;
      box-shadow: 0 20px 50px rgba(22,131,255,.22);
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 20px;
      display: flex;
      gap: 11px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card2);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    .message.user .message-avatar {
      background: var(--blue);
      color: white;
    }

    .message-content {
      max-width: calc(100% - 50px);
    }

    .message-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 15px;
      line-height: 1.9;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: rgba(22,131,255,.13);
      border-color: rgba(22,131,255,.18);
    }

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .message-action {
      width: 31px;
      height: 29px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }

    .message-action:hover {
      background: var(--card2);
      color: var(--text);
    }

    /* COMPOSER */

    .composer-area {
      position: absolute;
      left: 280px;
      right: 0;
      bottom: 0;
      padding: 15px 18px 20px;
      background: linear-gradient(
        to top,
        var(--bg) 60%,
        transparent
      );
      pointer-events: none;
    }

    .composer {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      pointer-events: auto;
      overflow: hidden;
    }

    .selected-file {
      display: none;
      padding: 9px 13px;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 9px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 45px;
      max-height: 130px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 11px 7px;
      font-size: 14px;
      line-height: 1.7;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .send-button {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-size: 17px;
      flex-shrink: 0;
    }

    .attach-button {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: var(--card2);
      color: var(--muted);
      font-size: 18px;
      flex-shrink: 0;
    }

    .composer-note {
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      padding: 0 0 8px;
    }

    #fileInput {
      display: none;
    }

    /* LOADING */

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 20px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: typing 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* MOBILE */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        top: 0;
        right: -290px;
        height: 100%;
        transition: .25s;
        box-shadow: -20px 0 50px rgba(0,0,0,.3);
      }

      .sidebar.open {
        right: 0;
      }

      .mobile-menu {
        display: block;
      }

      .composer-area {
        left: 0;
        right: 0;
      }

      .topbar {
        padding: 0 10px;
      }

      .top-title {
        font-size: 14px;
      }

      .messages {
        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 140px;
      }

      .message-content {
        max-width: calc(100% - 44px);
      }

      .message-bubble {
        font-size: 13px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .welcome p {
        font-size: 13px;
      }

      .lang-select {
        max-width: 80px;
      }
    }

    @media (max-width: 430px) {
      .auth-card {
        padding: 27px 18px;
      }

      .top-actions {
        gap: 4px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
      }

      .lang-select {
        height: 36px;
        font-size: 11px;
      }

      .composer-area {
        padding: 10px 8px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH PAGE
  ========================= -->

  <section id="authPage">

    <div class="auth-container">

      <div class="auth-glow"></div>

      <div class="auth-card">

        <div class="logo">N</div>

        <div class="auth-title">Nexora AI</div>

        <div class="auth-subtitle">
          هوش مصنوعی مدرن برای همه
        </div>

        <div class="auth-tabs">

          <button
            class="auth-tab active"
            id="loginTab"
            onclick="setAuthMode('login')">
            ورود
          </button>

          <button
            class="auth-tab"
            id="signupTab"
            onclick="setAuthMode('signup')">
            ثبت‌نام
          </button>

        </div>

        <form id="authForm">

          <div
            class="field"
            id="nameField"
            style="display:none;">

            <label>نام شما</label>

            <input
              id="nameInput"
              type="text"
              placeholder="نام خود را وارد کنید">

          </div>

          <div class="field">

            <label>ایمیل</label>

            <input
              id="emailInput"
              type="email"
              placeholder="example@email.com"
              autocomplete="email"
              required>

          </div>

          <div class="field">

            <label>رمز عبور</label>

            <input
              id="passwordInput"
              type="password"
              placeholder="حداقل 6 کاراکتر"
              autocomplete="current-password"
              required>

          </div>

          <button
            class="auth-button"
            id="authButton"
            type="submit">

            ورود به Nexora AI

          </button>

        </form>

        <div
          id="authMessage"
          class="auth-message">
        </div>

        <div class="auth-footer">
          اطلاعات حساب شما توسط Supabase مدیریت می‌شود.
          <br>
          Nexora AI © 2026
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       APP PAGE
  ========================= -->

  <section id="appPage">

    <div class="app">

      <!-- SIDEBAR -->

      <aside
        class="sidebar"
        id="sidebar">

        <div class="sidebar-header">

          <div class="brand">

            <div class="brand-logo">
              N
            </div>

            <div>
              <div class="brand-name">
                Nexora AI
              </div>

              <div class="brand-status">
                ● Online
              </div>
            </div>

          </div>

          <button
            class="new-chat"
            onclick="newChat()">

            ＋ چت جدید

          </button>

        </div>

        <div class="history-title">
          تاریخچه گفتگوها
        </div>

        <div
          class="history"
          id="history">
        </div>

        <div class="sidebar-bottom">

          <div class="user-box">

            <div
              class="avatar"
              id="userAvatar">
              N
            </div>

            <div class="user-info">

              <div
                class="user-name"
                id="userName">
                کاربر
              </div>

              <div
                class="user-email"
                id="userEmail">
                -
              </div>

            </div>

          </div>

          <button
            class="logout-button"
            onclick="logout()">

            خروج از حساب

          </button>

        </div>

      </aside>


      <!-- MAIN -->

      <main class="main">

        <header class="topbar">

          <div class="top-title">
            <span id="topTitle">Nexora AI</span>
          </div>

          <div class="top-actions">

            <select
              class="lang-select"
              id="languageSelect"
              onchange="changeLanguage()">

              <option value="fa">فارسی</option>
              <option value="de">Deutsch</option>
              <option value="en">English</option>

            </select>

            <button
              class="icon-button"
              onclick="toggleTheme()"
              title="تغییر حالت">

              ◐

            </button>

            <button
              class="icon-button mobile-menu"
              onclick="toggleSidebar()">

              ☰

            </button>

          </div>

        </header>


        <div
          class="messages"
          id="messages">

        </div>

      </main>

    </div>


    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <div
          class="selected-file"
          id="selectedFile">
        </div>

        <div class="composer-row">

          <button
            class="attach-button"
            onclick="document.getElementById('fileInput').click()"
            title="آپلود فایل">

            ＋

          </button>

          <input
            type="file"
            id="fileInput"
            onchange="selectFile(event)">

          <textarea
            id="messageInput"
            placeholder="پیام خود را بنویسید..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)">
          </textarea>

          <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()">

            ➤

          </button>

        </div>

        <div class="composer-note">
          Nexora AI ممکن است گاهی پاسخ نادرست بدهد. اطلاعات مهم را بررسی کنید.
        </div>

      </div>

    </div>

  </section>


  <script>

    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
      "https://sxdrddzjctxslwewbcvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_g_EB1CR9UvX80ckqGnRgCA_lnnzzrcr";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let authMode = "login";

    let currentUser = null;

    let currentChat = [];

    let chats = [];

    let selectedFile = null;

    let currentChatId = null;


    /* =====================================================
       AUTH MODE
    ===================================================== */

    function setAuthMode(mode) {

      authMode = mode;

      const loginTab =
        document.getElementById("loginTab");

      const signupTab =
        document.getElementById("signupTab");

      const nameField =
        document.getElementById("nameField");

      const authButton =
        document.getElementById("authButton");

      clearAuthMessage();

      if (mode === "login") {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        nameField.style.display = "none";

        authButton.textContent =
          "ورود به Nexora AI";

      } else {

        loginTab.classList.remove("active");
        signupTab.classList.add("active");

        nameField.style.display = "block";

        authButton.textContent =
          "ساخت حساب";

      }
    }


    /* =====================================================
       AUTH MESSAGE
    ===================================================== */

    function showAuthMessage(message, type = "error") {

      const box =
        document.getElementById("authMessage");

      box.textContent = message;

      box.className =
        "auth-message " + type;
    }


    function clearAuthMessage() {

      const box =
        document.getElementById("authMessage");

      box.textContent = "";

      box.className =
        "auth-message";
    }


    /* =====================================================
       AUTH SUBMIT
    ===================================================== */

    document
      .getElementById("authForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const email =
          document
            .getElementById("emailInput")
            .value
            .trim();

        const password =
          document
            .getElementById("passwordInput")
            .value;

        const name =
          document
            .getElementById("nameInput")
            .value
            .trim();

        const button =
          document.getElementById("authButton");

        clearAuthMessage();

        if (!email || !password) {

          showAuthMessage(
            "لطفاً ایمیل و رمز عبور را وارد کنید."
          );

          return;
        }

        if (authMode === "signup" && !name) {

          showAuthMessage(
            "لطفاً نام خود را وارد کنید."
          );

          return;
        }

        button.disabled = true;

        button.textContent =
          authMode === "login"
            ? "در حال ورود..."
            : "در حال ساخت حساب...";


        try {

          if (authMode === "signup") {

            const {
              data,
              error
            } =
              await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                  data: {
                    full_name: name
                  }

                }

              });


            if (error) {
              throw error;
            }


            /*
              اگر Email Confirmation در Supabase فعال باشد،
              ممکن است session خالی باشد.
            */

            if (!data.session) {

              showAuthMessage(
                "حساب ساخته شد. لطفاً ایمیل خود را تأیید کنید و سپس وارد حساب شوید.",
                "success"
              );

              setAuthMode("login");

            } else {

              await loadUser(data.user);

            }

          } else {

            const {
              data,
              error
            } =
              await supabaseClient.auth
                .signInWithPassword({

                  email: email,

                  password: password

                });


            if (error) {
              throw error;
            }

            await loadUser(data.user);

          }

        } catch (error) {

          console.error(error);

          let message =
            error.message ||
            "خطایی رخ داد.";

          if (
            message
              .toLowerCase()
              .includes("invalid login")
          ) {

            message =
              "ایمیل یا رمز عبور اشتباه است.";

          }

          if (
            message
              .toLowerCase()
              .includes("email not confirmed")
          ) {

            message =
              "ابتدا ایمیل خود را تأیید کنید.";

          }

          if (
            message
              .toLowerCase()
              .includes("password")
          ) {

            message =
              "رمز عبور باید حداقل 6 کاراکتر باشد.";

          }

          showAuthMessage(message);

        } finally {

          button.disabled = false;

          button.textContent =
            authMode === "login"
              ? "ورود به Nexora AI"
              : "ساخت حساب";

        }

      });


    /* =====================================================
       CHECK SESSION
    ===================================================== */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();

        if (error) {
          console.error(error);
          return;
        }

        if (data.session && data.session.user) {

          await loadUser(data.session.user);

        } else {

          showAuthPage();

        }

      } catch (error) {

        console.error(error);

        showAuthPage();

      }

    }


    /* =====================================================
       AUTH STATE LISTENER
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Supabase auth event:",
          event
        );

        if (
          session &&
          session.user &&
          event !== "SIGNED_OUT"
        ) {

          /*
            از اجرای دوباره غیرضروری جلوگیری می‌کنیم.
          */

          if (
            !currentUser ||
            currentUser.id !== session.user.id
          ) {

            await loadUser(session.user);

          }

        } else if (
          event === "SIGNED_OUT"
        ) {

          currentUser = null;

          showAuthPage();

        }

      }
    );


    /* =====================================================
       LOAD USER
    ===================================================== */

    async function loadUser(user) {

      if (!user) {
        return;
      }

      currentUser = user;


      /*
        نام کاربر از metadata
      */

      const metadata =
        user.user_metadata || {};

      const fullName =
        metadata.full_name ||
        user.email?.split("@")[0] ||
        "User";


      /*
        ذخیره / به‌روزرسانی پروفایل
      */

      try {

        const {
          error
        } =
          await supabaseClient
            .from("user_profiles")
            .upsert({

              id: user.id,

              full_name: fullName,

              email: user.email,

              last_login:
                new Date().toISOString()

            }, {

              onConflict: "id"

            });

        if (error) {

          console.error(
            "Profile error:",
            error
          );

        }

      } catch (error) {

        console.error(error);

      }


      showAppPage();

      setupUserInfo(
        fullName,
        user.email
      );

      loadUserChats();

    }


    /* =====================================================
       USER INFO
    ===================================================== */

    function setupUserInfo(name, email) {

      const userName =
        document.getElementById("userName");

      const userEmail =
        document.getElementById("userEmail");

      const userAvatar =
        document.getElementById("userAvatar");

      userName.textContent =

      userEmail.textContent =
        email || "";

      userAvatar.textContent =
        (name || "N")

          .toUpperCase();
    }


    /* =====================================================
       SHOW / HIDE PAGES
    ===================================================== */

    function showAppPage() {

      document.getElementById(
        "authPage"
      ).style.display = "none";

      document.getElementById(
        "appPage"
      ).style.display = "block";

    }


    function showAuthPage() {

      document.getElementById(
        "authPage"
      ).style.display = "flex";

      document.getElementById(
        "appPage"
      ).style.display = "none";

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

      try {

        saveCurrentChat();

        await supabaseClient.auth.signOut();

        currentUser = null;

        currentChat = [];

        chats = [];

        currentChatId = null;

        document.getElementById(
          "history"
        ).innerHTML = "";

        showAuthPage();

          "passwordInput"

    /* =====================================================
       USER-SPECIFIC CHAT STORAGE
    ===================================================== */

    function getChatStorageKey() {

      if (!currentUser) {
        return null;
      }

      return "nexoraChats_" + currentUser.id;

    }


    /* =====================================================
       LOAD CHATS
    ===================================================== */

    function loadUserChats() {

      if (!currentUser) {
        return;
      }

      const key =
        getChatStorageKey();

      try {

        const saved =
          localStorage.getItem(key);

        chats =
          saved
            ? JSON.parse(saved)
            : [];

      } catch (error) {

        chats = [];

      }

      currentChat = [];

      currentChatId = null;

      renderHistory();

      renderMessages();

    }


    /* =====================================================
       SAVE CHATS
    ===================================================== */

    function saveChats() {

      if (!currentUser) {
        return;
      }

      const key =
        getChatStorageKey();

      localStorage.setItem(
        key,
        JSON.stringify(chats)
      );

    }


    /* =====================================================
       SAVE CURRENT CHAT
    ===================================================== */

    function saveCurrentChat() {

      if (
        !currentUser ||
        !currentChat ||
        currentChat.length === 0
      ) {
        return;
      }

      /*
        اگر ID نداریم، ایجاد می‌کنیم.
      */

      if (!currentChatId) {

        currentChatId =
          Date.now().toString();

      }

      /*
        عنوان را از اولین پیام کاربر می‌گیریم.
      */

      const firstUserMessage =
        currentChat.find(
          item => item.role === "user"
        );

      let title =
        firstUserMessage
          ? firstUserMessage.content
          : "گفتگوی جدید";

      title =
        title
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 40);

      const existingIndex =
        chats.findIndex(
          chat =>
            chat.id === currentChatId
        );

      const chatObject = {

        id: currentChatId,

        title:
          title || "گفتگوی جدید",

        messages:
          currentChat,

        updatedAt:
          Date.now()

      };


      if (existingIndex >= 0) {

        chats[existingIndex] =
          chatObject;

      } else {

        chats.unshift(
          chatObject
        );

      }

      /*
        جدیدترین گفتگوها اول باشند.
      */

      chats.sort(
        (a, b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

      saveChats();

      renderHistory();

    }


    /* =====================================================
       NEW CHAT
    ===================================================== */

    function newChat() {

      saveCurrentChat();

      currentChat = [];

      currentChatId = null;

      selectedFile = null;

      document.getElementById(
        "selectedFile"
      ).style.display = "none";

      document.getElementById(
        "selectedFile"
      ).textContent = "";

      document.getElementById(
        "fileInput"
      ).value = "";

      renderMessages();

      closeSidebarOnMobile();

    }


    /* =====================================================
       RENDER HISTORY
    ===================================================== */

    function renderHistory() {

      const history =
        document.getElementById(
          "history"
        );

      history.innerHTML = "";

      if (!chats.length) {

        const empty =
          document.createElement("div");

        empty.style.color =
          "var(--muted)";

        empty.style.fontSize =
          "12px";

        empty.style.textAlign =
          "center";

        empty.style.padding =
          "20px 5px";

        empty.textContent =
          "هنوز گفتگویی ندارید.";

        history.appendChild(empty);

        return;

      }


      chats.forEach(chat => {

        const item =
          document.createElement("div");

        item.className =
          "history-item" +
          (
            chat.id === currentChatId
              ? " active"
              : ""
          );

        const title =
          document.createElement("div");

        title.className =
          "history-name";

        title.textContent =
          chat.title ||
          "گفتگوی جدید";

        title.onclick =
          () => openChat(chat.id);

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "history-delete";

        deleteButton.textContent =
          "×";

        deleteButton.title =
          "حذف گفتگو";

        deleteButton.onclick =
          (event) => {

            event.stopPropagation();

            deleteChat(chat.id);

          };

        item.onclick = () =>
          openChat(chat.id);

        item.appendChild(title);

        item.appendChild(
          deleteButton
        );

        history.appendChild(item);

      });

    }


    /* =====================================================
       OPEN CHAT
    ===================================================== */

    function openChat(id) {

      saveCurrentChat();

      const chat =
        chats.find(
          item => item.id === id
        );

      if (!chat) {
        return;
      }

      currentChatId =
        chat.id;

      currentChat =
        Array.isArray(chat.messages)
          ? [...chat.messages]
          : [];

      renderHistory();

      renderMessages();

      closeSidebarOnMobile();

    }


    /* =====================================================
       DELETE CHAT
    ===================================================== */

    function deleteChat(id) {

      chats =
        chats.filter(
          chat => chat.id !== id
        );

      saveChats();

      if (currentChatId === id) {

        currentChat = [];

        currentChatId = null;

        renderMessages();

      }

      renderHistory();

    }


    /* =====================================================
       RENDER MESSAGES
    ===================================================== */

    function renderMessages() {

      const container =
        document.getElementById(
          "messages"
        );

      container.innerHTML = "";

      if (
        !currentChat ||
        currentChat.length === 0
      ) {

        const welcome =
          document.createElement("div");

        welcome.className =
          "welcome";

        welcome.innerHTML = `

          <div class="welcome-inner">

            <div class="welcome-icon">
              N
            </div>

            <h1>
              به Nexora AI خوش آمدید
            </h1>

            <p>
              یک دستیار هوش مصنوعی مدرن برای
              گفتگو، یادگیری، ایده‌پردازی و کمک
              در کارهای روزمره.
            </p>

          </div>

        `;

        container.appendChild(
          welcome
        );

        return;

      }


      currentChat.forEach(
        (message, index) => {

          addMessageToScreen(
            message.role === "user"
              ? "user"
              : "ai",
            message.content,
            false,
            index
          );

        }
      );

      scrollMessagesToBottom();

    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessageToScreen(
      role,
      content,
      save = true,
      messageIndex = null
    ) {

      const container =
        document.getElementById(
          "messages"
        );

      /*
        Welcome را پاک می‌کنیم.
      */

      const welcome =
        container.querySelector(
          ".welcome"
        );

      if (welcome) {
        welcome.remove();
      }


      const message =
        document.createElement("div");

      message.className =
        "message " +
        (
          role === "user"
            ? "user"
            : "ai"
        );


      const avatar =
        document.createElement("div");

      avatar.className =
        "message-avatar";

      avatar.textContent =
        role === "user"
          ? (
              currentUser?.user_metadata
                ?.full_name
                ?.charAt(0)
                ?.toUpperCase() ||
              "U"
            )
          : "N";


      const contentBox =
        document.createElement("div");

      contentBox.className =
        "message-content";


      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      bubble.textContent =
        content;


      contentBox.appendChild(
        bubble
      );


      /*
        فقط برای پاسخ AI دکمه کپی می‌گذاریم.
      */

      if (
        role === "ai" &&
        content &&
        content !== "..."
      ) {

        const actions =
          document.createElement("div");

        actions.className =
          "message-actions";

        const copy =
          document.createElement("button");

        copy.className =
          "message-action";

        copy.textContent =
          "کپی";

        copy.onclick =
          () => copyText(content);

        actions.appendChild(copy);

        contentBox.appendChild(
          actions
        );

      }


      message.appendChild(
        avatar
      );

      message.appendChild(
        contentBox
      );

      container.appendChild(
        message
      );


      if (save) {

        currentChat.push({

          role:
            role === "user"
              ? "user"
              : "assistant",

          content:
            content

        });

      }

      return message;

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

      if (!currentUser) {

        showAuthPage();

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );

      let text =
        input.value.trim();


      if (!text && !selectedFile) {
        return;
      }


      /*
        اگر فایل انتخاب شده باشد،
        نام فایل را به درخواست اضافه می‌کنیم.
      */

      if (selectedFile) {

        text +=
          "\n\n[فایل پیوست شده: " +
          selectedFile.name +
          "]";

      }


      input.value = "";

      autoResize(input);


      /*
        فایل را پاک می‌کنیم.
      */

      selectedFile = null;

      document.getElementById(
        "selectedFile"
      ).style.display = "none";

      document.getElementById(
        "selectedFile"
      ).textContent = "";

      document.getElementById(
        "fileInput"
      ).value = "";


      /*
        پیام کاربر
      */

      addMessageToScreen(
        "user",
        text
      );


      /*
        اگر اولین پیام است، ID بساز.
      */

      if (!currentChatId) {

        currentChatId =
          Date.now().toString();

      }


      /*
        پیام loading
      */

      const loadingElement =
        addMessageToScreen(
          "ai",
          "..."
        );


      const loadingBubble =
        loadingElement
          .querySelector(
            ".message-bubble"
          );

      loadingBubble.innerHTML = `

        <div class="typing">

          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>

        </div>

      `;


      const sendButton =
        document.getElementById(
          "sendButton"
        );

      sendButton.disabled = true;


      try {

        /*
          پیام loading آخرین مورد currentChat است.
          آن را برای AI ارسال نمی‌کنیم.
        */

        const conversation =
          currentChat
            .slice(0, -1)
            .map(item => ({

              role:
                item.role === "assistant"
                  ? "assistant"
                  : "user",

              content:
                item.content

            }));


        /*
          Puter AI
        */

        const response =
          await puter.ai.chat(
            conversation
          );


        let answer = "";


        if (
          typeof response === "string"
        ) {

          answer =
            response;

        } else if (
          response &&
          response.message &&
          typeof response.message.content === "string"
        ) {

          answer =
            response.message.content;

        } else if (
          response &&
          typeof response.content === "string"
        ) {

          answer =
            response.content;

        } else {

          answer =
            JSON.stringify(
              response
            );

        }


        /*
          loading را با پاسخ واقعی عوض می‌کنیم.
        */

        const loadingIndex =
          currentChat.length - 1;

        if (
          currentChat[loadingIndex] &&
          currentChat[loadingIndex].role === "assistant"
        ) {

          currentChat[loadingIndex].content =
            answer;

        } else {

          currentChat.push({

            role: "assistant",

            content: answer

          });

        }


        /*
          دوباره نمایش بده
        */

        renderMessages();


        /*
          ذخیره گفتگو
        */

        saveCurrentChat();

      } catch (error) {

        console.error(
          "AI Error:",
          error
        );


        const loadingIndex =
          currentChat.length - 1;

        const errorText =
          "متأسفانه در دریافت پاسخ مشکلی پیش آمد. لطفاً دوباره تلاش کنید.";

        if (
          currentChat[loadingIndex]
        ) {

          currentChat[loadingIndex].content =
            errorText;

        } else {

          currentChat.push({

            role: "assistant",

            content: errorText

          });

        }

        renderMessages();

        saveCurrentChat();

      } finally {

        sendButton.disabled = false;

        input.focus();

      }

    }


    /* =====================================================
       COPY
    ===================================================== */

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(
          text
        );

        showTemporaryMessage(
          "پاسخ کپی شد ✓"
        );

      } catch (error) {

        /*
          روش جایگزین برای بعضی مرورگرهای موبایل
        */

        const textarea =
          document.createElement(
            "textarea"
          );

        textarea.value = text;

        document.body.appendChild(
          textarea
        );

        textarea.select();

        try {

          document.execCommand(
            "copy"
          );

          showTemporaryMessage(
            "پاسخ کپی شد ✓"
          );

        } catch (e) {

          showTemporaryMessage(
            "کپی انجام نشد."
          );

        }

        textarea.remove();

      }

    }


    /* =====================================================
       TEMPORARY MESSAGE
    ===================================================== */

    function showTemporaryMessage(text) {

      const old =
        document.getElementById(
          "temporaryMessage"
        );

      if (old) {
        old.remove();
      }

      const box =
        document.createElement(
          "div"
        );

      box.id =
        "temporaryMessage";

      box.textContent =
        text;

      box.style.position =
        "fixed";

      box.style.left =
        "50%";

      box.style.bottom =
        "100px";

      box.style.transform =
        "translateX(-50%)";

      box.style.background =
        "var(--card2)";

      box.style.color =
        "var(--text)";

      box.style.border =
        "1px solid var(--border)";

      box.style.padding =
        "10px 17px";

      box.style.borderRadius =
        "12px";

      box.style.fontSize =
        "12px";

      box.style.zIndex =
        "999";

      document.body.appendChild(
        box
      );

      setTimeout(
        () => box.remove(),
        1800
      );

    }


    /* =====================================================
       FILE
    ===================================================== */

    function selectFile(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      selectedFile =
        file;


      const box =
        document.getElementById(
          "selectedFile"
        );

      box.textContent =
        "📎 " +
        file.name;

      box.style.display =
        "block";

    }


    /* =====================================================
       KEYBOARD
    ===================================================== */

    function handleKey(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       AUTO RESIZE
    ===================================================== */

    function autoResize(textarea) {

      textarea.style.height =
        "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          130
        ) + "px";

    }


    /* =====================================================
       THEME
    ===================================================== */

    function toggleTheme() {

      document.body.classList.toggle(
        "light"
      );

      const isLight =
        document.body.classList.contains(
          "light"
        );

      localStorage.setItem(
        "nexoraTheme",
        isLight
          ? "light"
          : "dark"
      );

    }


    function loadTheme() {

      const theme =
        localStorage.getItem(
          "nexoraTheme"
        );

      if (theme === "light") {

        document.body.classList.add(
          "light"
        );

      }

    }


    /* =====================================================
       LANGUAGE
    ===================================================== */

    function changeLanguage() {

      const language =
        document.getElementById(
          "languageSelect"
        ).value;

      const input =
        document.getElementById(
          "messageInput"
        );


      if (language === "fa") {

        document.documentElement.lang =
          "fa";

        document.documentElement.dir =
          "rtl";

        input.placeholder =
          "پیام خود را بنویسید...";

      }


      if (language === "de") {

        document.documentElement.lang =
          "de";

        document.documentElement.dir =
          "ltr";

        input.placeholder =
          "Schreiben Sie Ihre Nachricht...";

      }


      if (language === "en") {

        document.documentElement.lang =
          "en";

        document.documentElement.dir =
          "ltr";

        input.placeholder =
          "Write your message...";

      }

      localStorage.setItem(
        "nexoraLanguage",
        language
      );

    }


    function loadLanguage() {

      const language =
        localStorage.getItem(
          "nexoraLanguage"
        ) || "fa";

      document.getElementById(
        "languageSelect"
      ).value =
        language;

      changeLanguage();

    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    function toggleSidebar() {

      const sidebar =
        document.getElementById(
          "sidebar"
        );

      sidebar.classList.toggle(
        "open"
      );

    }


    function closeSidebarOnMobile() {

      if (
        window.innerWidth <= 800
      ) {

        document
          .getElementById("sidebar")
          .classList.remove("open");

      }

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollMessagesToBottom() {

      const container =
        document.getElementById(
          "messages"
        );

      setTimeout(() => {

        container.scrollTop =
          container.scrollHeight;

      }, 50);

    }


    /* =====================================================
       BEFORE LEAVING
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        saveCurrentChat();

      }
    );


    /* =====================================================
       START
    ===================================================== */

    loadTheme();

    loadLanguage();

    checkSession();

  </script>

</body>
</html>
