<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
:root {
    --bg: #070b14;
    --sidebar: #0b1120;
    --card: #101a2c;
    --border: #1c2d48;
    --blue: #1683ff;
    --text: #f1f5ff;
    --muted: #8494ad;
}
body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}
.app {
    display: flex;
    height: 100vh;
}
/* Sidebar */
.sidebar {
    width: 270px;
    background: var(--sidebar);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 15px;
    transition: 0.3s;
    z-index: 10;
}
.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-bottom: 30px;
}
.logo-icon {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    background: linear-gradient(135deg, #087cff, #0046a8);
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 0 25px #087cff45;
}
.logo h2 {
    font-size: 20px;
    letter-spacing: .5px;
}
.logo span {
    color: #318dff;
}
.new-chat {
    background: linear-gradient(135deg, #147eff, #0753b8);
    border: none;
    border-radius: 13px;
    color: white;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 25px;
    box-shadow: 0 5px 25px #087cff25;
}
.new-chat:hover {
    filter: brightness(1.15);
}
.side-title {
    color: var(--muted);
    font-size: 12px;
    margin: 10px;
}
.chat-history {
    flex: 1;
    overflow-y: auto;
}
.history-item {
    padding: 12px;
    border-radius: 10px;
    color: #b8c5d9;
    font-size: 13px;
    margin-bottom: 5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.history-item:hover {
    background: #14233b;
    color: white;
}
.side-bottom {
    border-top: 1px solid var(--border);
    padding-top: 15px;
}
.side-link {
    padding: 12px;
    color: #a6b5ca;
    font-size: 13px;
    cursor: pointer;
    border-radius: 10px;
}
.side-link:hover {
    background: #14233b;
}
/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    background:
        radial-gradient(circle at 50% -20%, #0b3160 0%, transparent 45%),
        var(--bg);
}
.topbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid #15243a;
    background: #070b14d9;
    backdrop-filter: blur(20px);
}
.menu-btn {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 25px;
    cursor: pointer;
}
.model-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
}
.status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22d58a;
    box-shadow: 0 0 12px #22d58a;
}
.top-actions {
    display: flex;
    gap: 8px;
}
.icon-btn {
    background: #101a2c;
    border: 1px solid #20304a;
    color: #b7c8df;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 17px;
}
.icon-btn:hover {
    background: #19365a;
    color: white;
}
/* Chat */
.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
    scroll-behavior: smooth;
}
.messages {
    max-width: 850px;
    margin: auto;
}
.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 15px;
}
.ai-orb {
    width: 100px;
    height: 100px;
    border-radius: 30px;
    background: linear-gradient(135deg, #147eff, #082b67);
    display: grid;
    place-items: center;
    font-size: 48px;
    margin-bottom: 25px;
    box-shadow: 0 0 70px #087cff35;
    animation: float 4s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.welcome h1 {
    font-size: 34px;
    margin-bottom: 12px;
    font-weight: 800;
}
.welcome h1 span {
    color: #298bff;
}
.welcome p {
    color: var(--muted);
    font-size: 14px;
    max-width: 440px;
    line-height: 2;
}
.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 600px;
    width: 100%;
    margin-top: 35px;
}
.suggestion {
    text-align: right;
    padding: 16px;
    background: #0d1728;
    border: 1px solid #1c2d48;
    border-radius: 15px;
    color: #c5d2e5;
    font-family: inherit;
    cursor: pointer;
    transition: .2s;
}
.suggestion:hover {
    border-color: #1683ff;
    background: #112746;
    transform: translateY(-2px);
}
.suggestion strong {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
}
.suggestion small {
    color: #71839e;
    font-size: 11px;
}
/* Messages */
.message {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
    animation: appear .3s ease;
}
@keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.avatar {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
}
.user-avatar {
    background: #20324d;
}
.ai-avatar {
    background: linear-gradient(135deg, #147eff, #06428e);
}
.message-content {
    flex: 1;
    min-width: 0;
}
.message-name {
    font-size: 12px;
    color: #8fa4c1;
    margin-bottom: 8px;
}
.message-text {
    font-size: 14px;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.user-message .message-text {
    background: #101f35;
    border: 1px solid #1c2d48;
    padding: 12px 15px;
    border-radius: 14px;
    display: inline-block;
}
.typing {
    display: flex;
    gap: 5px;
    padding-top: 10px;
}
.typing span {
    width: 7px;
    height: 7px;
    background: #378fff;
    border-radius: 50%;
    animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
    0%, 100% { opacity: .2; }
    50% { opacity: 1; }
}
/* Input */
.input-section {
    padding: 15px 20px 20px;
    background: linear-gradient(transparent, #070b14 30%);
}
.input-wrap {
    max-width: 850px;
    margin: auto;
}
.input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    background: #0d1728;
    border: 1px solid #294363;
    border-radius: 18px;
    box-shadow: 0 0 40px #00000025;
    transition: .2s;
}
.input-box:focus-within {
    border-color: #1683ff;
    box-shadow: 0 0 25px #087cff15;
}
textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    min-height: 28px;
    max-height: 130px;
    padding: 8px;
    line-height: 1.8;
}
textarea::placeholder {
    color: #61738f;
}
.send-btn {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #1683ff, #0750b5);
    color: white;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
}
.send-btn:hover {
    filter: brightness(1.2);
}
.send-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}
.input-note {
    text-align: center;
    font-size: 10px;
    color: #53647d;
    margin-top: 10px;
}
/* Mobile */
.overlay {
    display: none;
}
@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        right: -280px;
        top: 0;
        bottom: 0;
        transition: .3s;
    }
    .sidebar.open {
        right: 0;
    }
    .overlay {
        position: fixed;
        inset: 0;
        background: #0009;
        z-index: 5;
    }
    .overlay.active {
        display: block;
    }
    .menu-btn {
        display: block;
    }
    .topbar {
        padding: 0 15px;
        height: 62px;
    }
    .chat-area {
        padding: 20px 15px;
    }
    .welcome h1 {
        font-size: 26px;
    }
    .ai-orb {
        width: 80px;
        height: 80px;
        font-size: 38px;
    }
    .suggestions {
        grid-template-columns: 1fr;
        margin-top: 25px;
    }
    .input-section {
        padding: 10px 12px 15px;
    }
    .model-name {
        font-size: 12px;
    }
    .welcome p {
        font-size: 12px;
    }
}
</style>
</head>
<body>
<div class="app">
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">N</div>
        <h2>Nexora <span>AI</span></h2>
    </div>
    <button class="new-chat" id="newChat">
        ＋ چت جدید
    </button>
    <div class="side-title">گفتگوهای اخیر</div>
    <div class="chat-history" id="history">
        <div class="history-item">گفتگوی جدید</div>
    </div>
    <div class="side-bottom">
        <div class="side-link">⚙ تنظیمات</div>
        <div class="side-link">ⓘ درباره Nexora AI</div>
    </div>
</aside>
<main class="main">
    <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="model-name">
            <span class="status"></span>
            Nexora AI
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="clearBtn" title="پاک کردن چت">⌫</button>
        </div>
    </header>
    <section class="chat-area" id="chatArea">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="ai-orb">✦</div>
                <h1>سلام، من <span>Nexora AI</span> هستم</h1>
                <p>
                    دستیار هوشمند شما برای یادگیری، ترجمه،
                    برنامه‌نویسی و پاسخ به پرسش‌های روزمره.
                </p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="برای من یک برنامه یادگیری زبان آلمانی بساز.">
                        <strong>📚 یادگیری زبان</strong>
                        <small>یک برنامه آموزشی برای من بساز</small>
                    </button>
                    <button class="suggestion" data-prompt="به من کمک کن یک سایت حرفه‌ای بسازم.">
                        <strong>💻 برنامه‌نویسی</strong>
                        <small>کمک در ساخت سایت و کدنویسی</small>
                    </button>
                    <button class="suggestion" data-prompt="این جمله را به زبان آلمانی ترجمه کن: من امروز به مدرسه می‌روم.">
                        <strong>🌐 ترجمه</strong>
                        <small>ترجمه به زبان‌های مختلف</small>
                    </button>
                    <button class="suggestion" data-prompt="چطور می‌توانم مهارت‌های جدید یاد بگیرم؟">
                        <strong>💡 ایده و آموزش</strong>
                        <small>ایده‌های جدید برای یادگیری</small>
                    </button>
                </div>
            </div>
        </div>
    </section>
    <section class="input-section">
        <div class="input-wrap">
            <div class="input-box">
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="پیام خود را بنویسید..."
                ></textarea>
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
            <div class="input-note">
                Nexora AI ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.
            </div>
        </div>
    </section>
</main>
</div>
<script>
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const history = document.getElementById("history");
const chatArea = document.getElementById("chatArea");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const newChat = document.getElementById("newChat");
const clearBtn = document.getElementById("clearBtn");
let chatStarted = false;
let busy = false;
function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}
function addMessage(text, type) {
    if (!chatStarted) {
        welcome.remove();
        chatStarted = true;
    }
    const message = document.createElement("div");
    message.className = "message " + type + "-message";
    const avatar = type === "user" ? "م" : "✦";
    const name = type === "user" ? "شما" : "Nexora AI";
    message.innerHTML = `
        <div class="avatar ${type}-avatar">${avatar}</div>
        <div class="message-content">
            <div class="message-name">${name}</div>
            <div class="message-text">${escapeHTML(text)}</div>
        </div>
    `;
    messages.appendChild(message);
    scrollBottom();
}
function showTyping() {
    const message = document.createElement("div");
    message.className = "message ai-message";
    message.id = "typingMessage";
    message.innerHTML = `
        <div class="avatar ai-avatar">✦</div>
        <div class="message-content">
            <div class="message-name">Nexora AI</div>
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;
    messages.appendChild(message);
    scrollBottom();
}
function removeTyping() {
    const typing = document.getElementById("typingMessage");
    if (typing) typing.remove();
}
function scrollBottom() {
    setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
}
function getDemoReply(text) {
    const lower = text.toLowerCase();
    if (lower.includes("سلام") || lower.includes("hello")) {
        return "سلام! خوش آمدید به Nexora AI.\nچطور می‌توانم امروز به شما کمک کنم؟";
    }
    if (lower.includes("آلمانی") || lower.includes("ترجمه")) {
        return "حتماً! من می‌توانم در ترجمه و یادگیری زبان آلمانی به شما کمک کنم.\n\nجمله یا متن خود را بفرستید تا آن را برایتان توضیح بدهم.";
    }
    if (lower.includes("سایت") || lower.includes("برنامه")) {
        return "برای ساخت یک سایت حرفه‌ای می‌توانیم از HTML، CSS و JavaScript شروع کنیم.\n\nدر مرحله بعد، امکاناتی مانند حساب کاربری، ذخیره چت‌ها و اتصال به هوش مصنوعی واقعی را اضافه می‌کنیم.";
    }
    if (lower.includes("هوش مصنوعی") || lower.includes("ai")) {
        return "Nexora AI یک دستیار هوشمند برای کمک به مردم در سراسر جهان است.\n\nاین نسخه فعلاً نمایشی است. برای پاسخ‌های واقعی باید آن را به یک مدل هوش مصنوعی متصل کنیم.";
    }
    return "پیام شما را دریافت کردم.\n\nاین نسخه اول Nexora AI است و فعلاً پاسخ‌های نمایشی دارد. در مرحله بعد می‌توانیم اتصال به هوش مصنوعی واقعی را اضافه کنیم تا پاسخ‌های هوشمند و دقیق دریافت کنید.";
}
function sendMessage() {
    if (busy) return;
    const text = input.value.trim();
    if (!text) return;
    busy = true;
    sendBtn.disabled = true;
    addMessage(text, "user");
    input.value = "";
    input.style.height = "auto";
    addHistory(text);
    showTyping();
    setTimeout(() => {
        removeTyping();
        const reply = getDemoReply(text);
        addMessage(reply, "ai");
        busy = false;
        sendBtn.disabled = false;
    }, 900);
}
function addHistory(text) {
    const item = document.createElement("div");
    item.className = "history-item";
    item.textContent = text;
    history.prepend(item);
}
function startNewChat() {
    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="ai-orb">✦</div>
            <h1>سلام، من <span>Nexora AI</span> هستم</h1>
            <p>
                دستیار هوشمند شما برای یادگیری، ترجمه،
                برنامه‌نویسی و پاسخ به پرسش‌های روزمره.
            </p>
            <div class="suggestions">
                <button class="suggestion" data-prompt="برای من یک برنامه یادگیری زبان آلمانی بساز.">
                    <strong>📚 یادگیری زبان</strong>
                    <small>یک برنامه آموزشی برای من بساز</small>
                </button>
                <button class="suggestion" data-prompt="به من کمک کن یک سایت حرفه‌ای بسازم.">
                    <strong>💻 برنامه‌نویسی</strong>
                    <small>کمک در ساخت سایت و کدنویسی</small>
                </button>
                <button class="suggestion" data-prompt="این جمله را به زبان آلمانی ترجمه کن: من امروز به مدرسه می‌روم.">
                    <strong>🌐 ترجمه</strong>
                    <small>ترجمه به زبان‌های مختلف</small>
                </button>
                <button class="suggestion" data-prompt="چطور می‌توانم مهارت‌های جدید یاد بگیرم؟">
                    <strong>💡 ایده و آموزش</strong>
                    <small>ایده‌های جدید برای یادگیری</small>
                </button>
            </div>
        </div>
    `;
    chatStarted = false;
    busy = false;
    sendBtn.disabled = false;
    input.value = "";
    closeSidebar();
}
function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
}
function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("active");
}
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});
input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 130) + "px";
});
document.addEventListener("click", function(event) {
    const suggestion = event.target.closest(".suggestion");
    if (suggestion) {
        input.value = suggestion.dataset.prompt;
        input.focus();
    }
});
newChat.addEventListener("click", startNewChat);
clearBtn.addEventListener("click", startNewChat);
menuBtn.addEventListener("click", openSidebar);
overlay.addEventListener("click", closeSidebar);
</script>
</body>
</html>
